server:
  port: 8088   # bridge REST control API (NestJS calls this)

# ---- IVSS device (Dahua NetSDK, port 37777 — NOT http) ----
device:
  ip: 192.168.1.101
  port: 37777
  username: admin
  password: o858899789          # set via env IVSS_PASSWORD, do not commit
  # the Sample Database group the bridge enrolls SMRMPTS users into.
  # Leave blank to auto-create a group named by 'default-group-name' on first sync. 
  default-group-id: ""
  default-group-name: SMRMPTS
  # similarity threshold is configured on the IVSS web UI (Face Comparison arming),
  # the bridge only consumes whatever the device decides is a match.

# ---- where the bridge POSTs recognition events (the NestJS capstone-be) ----
nestjs:
  webhook-url: http://localhost:3000/api/v1/internal/ivss/events
  api-key: dev-secret-bridge           # shared secret, sent as X-Internal-Token; set via env NESTJS_BRIDGE_TOKEN

spring:
  config:
    activate:
      on-profile: default

logging:
  level:
    vn.attendance.bridge: INFO
