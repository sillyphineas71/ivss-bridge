server:
  port: ${BRIDGE_PORT:8088}   # bridge REST control API (NestJS calls this)

# ---- IVSS device (Dahua NetSDK, port 37777 — NOT http) ----
device:
  ip: ${IVSS_IP:127.0.0.1}
  port: ${IVSS_PORT:37777}
  username: ${IVSS_USERNAME:admin}
  password: ${IVSS_PASSWORD:}          # BẮT BUỘC set qua env, KHÔNG hard-code
  default-group-id: ${IVSS_GROUP_ID:1}
  default-group-name: ${IVSS_GROUP_NAME:SMRMPTS}

# ---- where the bridge POSTs recognition events (NestJS capstone-be) ----
nestjs:
  webhook-url: ${NESTJS_WEBHOOK_URL:http://localhost:3000/api/v1/internal/ivss/events}
  vehicle-webhook-url: ${NESTJS_VEHICLE_WEBHOOK_URL:http://localhost:3000/api/v1/internal/ivss/vehicle-events}
  occupancy-webhook-url: ${NESTJS_OCCUPANCY_WEBHOOK_URL:http://localhost:3000/api/v1/internal/ivss/occupancy-events}
  api-key: ${NESTJS_BRIDGE_TOKEN:}     # BẮT BUỘC set qua env, KHÔNG hard-code

spring:
  config:
    activate:
      on-profile: default

logging:
  level:
    vn.attendance.bridge: ${LOG_LEVEL:INFO}